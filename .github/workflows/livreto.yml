# Espelho automático do livreto: HTML e PDF sempre iguais à fonte.
#
# POR QUE ISTO EXISTE
# O site é estático (Pages, sem runtime), então o PDF não pode ser gerado sob demanda como
# no ERP — é gerado aqui. Sem isto, quem editasse `content.py` e rodasse só o `build.py`
# publicaria um PDF VELHO em silêncio: nada quebra, o comercial só manda a versão errada.
#
# ANTI-LOOP
# O gatilho escuta só as FONTES. O commit que este workflow faz toca apenas os GERADOS
# (livreto/index.html, livreto.pdf, livreto/.espelho.sha), que não estão no filtro.

name: livreto (espelho HTML + PDF)

on:
  push:
    branches: [main]
    paths:
      - 'livreto/content.py'
      - 'livreto/build.py'
      - 'livreto/build_pdf.sh'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refazer o PDF mesmo sem mudança de conteúdo'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: livreto
  cancel-in-progress: false

jobs:
  espelho:
    runs-on: ubuntu-latest
    steps:
      # `ref: main` de propósito: o default é o SHA do evento, e se o bot já commitou um
      # espelho depois dele o rebase do push conflita nos arquivos gerados.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Garante o Chrome (o runner já traz, mas não confie)
        run: |
          if ! command -v google-chrome >/dev/null; then
            wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -qq && sudo apt-get install -y -qq /tmp/chrome.deb
          fi
          google-chrome --version

      - name: Gera o HTML
        run: python3 livreto/build.py

      # O PDF do Chrome não é determinístico (carimba data), então a impressão digital é do
      # CONTEÚDO — HTML + assets que ele embute —, não dos bytes do PDF. find + LC_ALL=C sort
      # dá um valor reproduzível em qualquer máquina.
      - name: Fingerprint do conteúdo — precisa mesmo refazer o PDF?
        id: fp
        run: |
          NOVO=$(find livreto/index.html assets -type f | LC_ALL=C sort \
                 | xargs sha256sum | sha256sum | cut -c1-16)
          VELHO=$(cat livreto/.espelho.sha 2>/dev/null || echo "nenhum")
          echo "conteudo antigo=$VELHO novo=$NOVO"
          if [ "$NOVO" = "$VELHO" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "refazer=nao" >> $GITHUB_OUTPUT
            echo "espelho já está em dia — PDF não precisa ser refeito"
          else
            echo "refazer=sim" >> $GITHUB_OUTPUT
            echo "$NOVO" > livreto/.espelho.sha
          fi

      - name: Gera o PDF
        if: steps.fp.outputs.refazer == 'sim'
        run: bash livreto/build_pdf.sh

      # As travas do print CSS quebram em SILÊNCIO: sem `.rev{opacity:1}` o PDF sai EM
      # BRANCO. Então o CI abre o PDF e confere.
      - name: Confere que o PDF não saiu em branco
        if: steps.fp.outputs.refazer == 'sim'
        run: |
          sudo apt-get install -y -qq poppler-utils imagemagick
          PAGS=$(pdfinfo livreto.pdf | awk '/^Pages:/{print $2}')
          echo "páginas: $PAGS"
          [ "$PAGS" -ge 6 ] || { echo "::error::PDF com só $PAGS páginas — build quebrado"; exit 1; }
          pdfinfo livreto.pdf | grep -q "A4" || echo "::warning::PDF não está em A4"
          pdftoppm -jpeg -r 40 -f 1 -l 1 livreto.pdf /tmp/p1
          pdftoppm -jpeg -r 40 -f 4 -l 4 livreto.pdf /tmp/p4
          for f in /tmp/p1*.jpg /tmp/p4*.jpg; do
            SD=$(identify -format "%[standard-deviation]" "$f")
            echo "$f desvio=$SD"
            awk -v sd="$SD" 'BEGIN{ if (sd+0 < 1000) { print "::error::página em branco — o @media print quebrou (.rev{opacity:1})"; exit 1 } }'
          done

      - name: Commita o espelho
        run: |
          # `git status --porcelain` e não `git diff --quiet`: o diff não vê arquivo NOVO, e o
          # primeiro PDF nunca seria commitado (cicatriz do repo de origem).
          if [ -z "$(git status --porcelain -- livreto/index.html livreto.pdf livreto/.espelho.sha)" ]; then
            echo "nada mudou — sem commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livreto/index.html livreto.pdf livreto/.espelho.sha
          git commit -m "chore(livreto): regenera espelho HTML+PDF [skip ci]"
          echo "--- sujeira na árvore (só pra diagnóstico) ---"; git status --short
          for tent in 1 2 3; do
            git pull --rebase --autostash --quiet origin main && git push && exit 0
            echo "push rejeitado (tentativa $tent) — rebaseando"
            sleep 5
          done
          echo "::error::não consegui empurrar o espelho após 3 tentativas"; exit 1
