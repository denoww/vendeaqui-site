<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página não encontrada — vendeaqui</title>
<meta name="description" content="A página que você procurou não existe mais ou o endereço tem um erro de digitação." />
<!-- 404 não é indexada, mas os links SÃO seguidos: é assim que o crawler reencontra as
     páginas boas a partir de um link velho quebrado. -->
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#000000" />
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f5f5f7;color:#1d1d1f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:24px;
  }
  main{max-width:600px;text-align:center}
  .eyebrow{font-size:17px;letter-spacing:-.022em;color:#6e6e73;margin:0 0 12px}
  h1{font-size:clamp(32px,6vw,48px);line-height:1.08;letter-spacing:-.015em;font-weight:600;margin:0 0 16px}
  p.sub{font-size:19px;line-height:1.5;color:#6e6e73;margin:0 0 32px}
  nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a.btn{display:inline-block;border-radius:980px;padding:12px 22px;font-size:17px;font-weight:400;text-decoration:none;transition:background .2s,color .2s}
  a.cheio{background:#15803D;color:#fff}
  a.cheio:hover{background:#166534}
  a.linha{border:1px solid #d2d2d7;color:#1d1d1f}
  a.linha:hover{background:#ebebef}
  small{display:block;margin-top:40px;font-size:14px;color:#6e6e73}
  small a{color:#6e6e73}
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Erro 404</p>
    <h1>Essa página não existe.</h1>
    <p class="sub">O endereço pode ter um erro de digitação, ou a página saiu do ar. Os caminhos abaixo funcionam.</p>
    <nav>
      <a class="btn cheio" href="/">Ir para a home</a>
      <a class="btn linha" href="/entrar">Entrar</a>
      <a class="btn linha" href="/privacidade">Privacidade</a>
    </nav>
    <small>vendeaqui<a href="/" style="text-decoration:none">.app</a></small>
  </main>
</body>
</html>
